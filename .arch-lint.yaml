specs:
  # Application code uses the shared package for both typed errors and the
  # standard-library-compatible helpers it forwards.
  - name: shared-errors-only
    packages:
      include:
        - "**"
      exclude:
        - "pkg/errors"
        - "pkg/errors/**"
    rules:
      forbid:
        - "errors"

  # Reusable presentation toolkits own mechanics, never application policy.
  - name: presentation-toolkits-no-application
    packages:
      include:
        - "pkg/toolkits/*/**"
    rules:
      forbid:
        - "app/**"
        - "main/**"

  # Domain internals are available only to the facade, read/write services, and
  # other implementation packages. Every other current or future layer is denied.
  - name: domain-internals-have-explicit-consumers
    packages:
      include:
        - "app/domains/*"
        - "app/domains/*/**"
    rules:
      forbid:
        - "app/domains/{module}/internal/**"
      except:
        - "app/domains/{module}"
        - "app/domains/{module}/internal/**"
        - "app/domains/{module}/queries/**"
        - "app/domains/{module}/handlers/**"

  # Toolkits share no implementation details with sibling presentation modes.
  - name: presentation-toolkits-are-independent
    packages:
      include:
        - "pkg/toolkits/*/**"
    rules:
      forbid:
        - "pkg/toolkits/{toolkit}/**"
      except:
        - "pkg/toolkits/{toolkit}/**"

  # Every surface may use only the toolkit with the same presentation mode.
  - name: surfaces-use-matching-toolkit
    packages:
      include:
        - "app/domains/*/surfaces/*/**"
    rules:
      forbid:
        - "pkg/toolkits/{surface}/**"
      except:
        - "app/domains/*/surfaces/{surface}/**"

  # Domain surfaces do not depend on executable composition.
  - name: surfaces-no-composition
    packages:
      include:
        - "app/domains/*/surfaces/*/**"
    rules:
      forbid:
        - "main/**"

  # Concrete presentation surfaces are private to their domain and surface kind.
  # Captures make this apply automatically to every current and future surface.
  - name: surfaces-are-bespoke
    packages:
      include:
        - "app/domains/*/surfaces/*/**"
    rules:
      forbid:
        - "app/domains/{module}/surfaces/{surface}/**"
      except:
        - "app/domains/{module}/surfaces/{surface}/**"

  # Shared types cannot import domains.
  - name: shared-no-domains
    packages:
      include:
        - "app/*"
      exclude:
        - "app/domains/**"
    rules:
      forbid:
        - "app/domains/**"

  # Authorization contracts are implementation details of the domain that owns
  # them. Cross-domain collaboration uses public models, queries, and events.
  - name: domain-authz-is-private
    packages:
      include:
        - "app/domains/*"
        - "app/domains/*/**"
    rules:
      forbid:
        - "app/domains/{module}/authz"
        - "app/domains/{module}/authz/**"
      except:
        - "app/domains/{module}"
        - "app/domains/{module}/**"

  # Commands publish facts owned by their own domain; they must not emit another
  # domain's events. Other domain layers may still consume public events.
  - name: commands-emit-own-domain-events
    packages:
      include:
        - "app/domains/*/internal/commands"
        - "app/domains/*/internal/commands/**"
    rules:
      forbid:
        - "app/domains/{module}/events"
        - "app/domains/{module}/events/**"
      except:
        - "app/domains/{module}/internal/commands"
        - "app/domains/{module}/internal/commands/**"

  # Handlers cannot import commands.
  - name: handlers-no-commands
    packages:
      include:
        - "app/domains/*/handlers/**"
    rules:
      forbid:
        - "app/domains/*/internal/commands/**"

  # Queries are read-only - no command imports.
  - name: queries-no-commands
    packages:
      include:
        - "app/domains/*/queries/**"
    rules:
      forbid:
        - "app/domains/*/internal/commands/**"

  # Handlers use queries, not modules.
  - name: handlers-no-modules
    packages:
      include:
        - "app/domains/*/handlers/**"
    rules:
      forbid:
        - "app/domains/*"
