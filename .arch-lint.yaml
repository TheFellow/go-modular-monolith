specs:
  # The reusable Fyne toolkit owns desktop mechanics, never application policy.
  - name: fyne-toolkit-no-application
    packages:
      include:
        - "pkg/fyne/**"
    rules:
      forbid:
        - "app/**"
        - "main/**"

  # Domain GUI surfaces adapt public module APIs without reaching into internals.
  - name: gui-surfaces-use-public-domain-api
    packages:
      include:
        - "app/domains/*/surfaces/gui/**"
    rules:
      forbid:
        - "app/domains/*/internal/**"
        - "app/domains/*/surfaces/cli/**"
        - "app/domains/*/surfaces/tui/**"
        - "main/**"
        - "pkg/tui/**"

  # A domain owns its GUI presentation; sibling surfaces are not a reuse layer.
  - name: gui-surfaces-no-cross-domain-surfaces
    packages:
      include:
        - "app/domains/*/surfaces/gui/**"
    rules:
      forbid:
        - "app/domains/{module}/surfaces/**"
      except:
        - "app/domains/{module}/surfaces/gui/**"

  # The reusable TUI toolkit owns terminal mechanics, never application policy.
  - name: tui-toolkit-no-application
    packages:
      include:
        - "pkg/tui/**"
    rules:
      forbid:
        - "app/**"
        - "main/**"

  # Same-domain TUI surfaces use public APIs even though Go permits internal imports.
  - name: tui-surfaces-use-public-domain-api
    packages:
      include:
        - "app/domains/*/surfaces/tui/**"
    rules:
      forbid:
        - "app/domains/*/internal/**"

  # TUI surfaces are terminal adapters, not a reuse layer for other concrete views.
  - name: tui-surfaces-are-bespoke
    packages:
      include:
        - "app/domains/*/surfaces/tui/**"
    rules:
      forbid:
        - "app/domains/*/surfaces/cli/**"
        - "app/domains/*/surfaces/gui/**"

  # CLI surfaces adapt public APIs directly rather than depending on interactive views.
  - name: cli-surfaces-are-bespoke
    packages:
      include:
        - "app/domains/*/surfaces/cli/**"
    rules:
      forbid:
        - "app/domains/*/surfaces/gui/**"
        - "app/domains/*/surfaces/tui/**"

  # Shared types cannot import domains.
  - name: shared-no-domains
    packages:
      include:
        - "app/*"
      exclude:
        - "app/domains/**"
    rules:
      forbid:
        - "app/domains/**"

  # Cross-domain internal access forbidden.
  - name: no-cross-domain-internal
    packages:
      include:
        - "app/domains/{module}/**"
    rules:
      forbid:
        - "app/domains/{!module}/internal/**"

  # Handlers cannot import commands.
  - name: handlers-no-commands
    packages:
      include:
        - "app/domains/*/handlers/**"
    rules:
      forbid:
        - "app/domains/*/internal/commands"
        - "app/domains/*/internal/commands/**"

  # Events are public contracts - no internal dependencies.
  - name: events-no-internal
    packages:
      include:
        - "app/domains/*/events/**"
    rules:
      forbid:
        - "app/domains/*/internal/**"

  # Queries are read-only - no command imports.
  - name: queries-no-commands
    packages:
      include:
        - "app/domains/*/queries/**"
    rules:
      forbid:
        - "app/domains/*/internal/commands/**"

  # Models are dependency-free within module.
  - name: models-no-internal
    packages:
      include:
        - "app/domains/*/models/**"
    rules:
      forbid:
        - "app/domains/*/internal/**"

  # Handlers use queries, not modules.
  - name: handlers-no-modules
    packages:
      include:
        - "app/domains/*/handlers/**"
    rules:
      forbid:
        - "app/domains/*"
      except:
        - "app/domains/*/events"
        - "app/domains/*/queries"
        - "app/domains/*/models"
        - "app/domains/*/internal/**"
